<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle e solicitação de EED - Energisa</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 e ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel para compilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- SheetJS para importação/exportação Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background: linear-gradient(rgba(5, 14, 20, 0.90), rgba(4, 18, 26, 0.95)),
                  url('https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #030D14; }
    ::-webkit-scrollbar-thumb { background: #0F3B4C; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #10B981; }
  </style>
</head>
<body class="text-zinc-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // CONFIGURAÇÃO DO FIREBASE (eed-fi-re)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCiXHFPQiPNH-90-26oRiIgt15KIqnaM9E",
      authDomain: "eed-fi-re.firebaseapp.com",
      projectId: "eed-fi-re",
      storageBucket: "eed-fi-re.firebasestorage.app",
      messagingSenderId: "437178422694",
      appId: "1:437178422694:web:bd5c3f885d9ff39d02ab67",
      measurementId: "G-1VCT22BD4Q"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const ADMIN_SISTEMA = "renataalcantaraferreira@gmail.com";
    const SENHA_MESTRE_CORRETA = "69472";

    // Componente do Símbolo com Gradiente Verde e Ciano
    const IconeSimboloEnergisa = ({ className = "w-7 h-7" }) => (
      <svg viewBox="0 0 200 200" className={className} fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gradAuroraVerde" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#10B981" />
            <stop offset="50%" stopColor="#06B6D4" />
            <stop offset="100%" stopColor="#0284C7" />
          </linearGradient>
          <linearGradient id="gradAuroraAzul" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#38BDF8" />
            <stop offset="60%" stopColor="#0EA5E9" />
            <stop offset="100%" stopColor="#059669" />
          </linearGradient>
        </defs>
        <path d="M50,10 C130,20 170,80 100,100 C150,110 175,170 140,190 C180,130 140,50 50,10 Z" fill="url(#gradAuroraVerde)" opacity="0.95" />
        <path d="M40,130 C70,100 110,95 90,60 C125,95 85,145 40,185 C35,165 35,145 40,130 Z" fill="url(#gradAuroraAzul)" opacity="0.85" />
        <circle cx="110" cy="70" r="2" fill="#FFFFFF" opacity="0.85" />
        <circle cx="90" cy="110" r="1.5" fill="#FFFFFF" opacity="0.95" />
        <circle cx="130" cy="135" r="2" fill="#FFFFFF" opacity="0.75" />
      </svg>
    );

    const gerarCarimboAuditoria = (emailUsuario) => {
      const agora = new Date();
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      const dia = String(agora.getDate()).padStart(2, '0');
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const identificador = emailUsuario ? emailUsuario.split('@')[0] : 'sistema';
      return `${identificador} às ${horas}h${minutos} (${dia}/${mes})`;
    };

    function App() {
      const inputArquivoExcelRef = useRef(null);

      // ==========================================
      // CONTROLE DE ACESSO SINCRONIZADO
      // ==========================================
      const [usuariosPermitidos, setUsuariosPermitidos] = useState([ADMIN_SISTEMA]);
      const [solicitacoesAcesso, setSolicitacoesAcesso] = useState([]);
      const [usuarioLogado, setUsuarioLogado] = useState(() => localStorage.getItem('usuario_logado_eed_energisa_v2') || null);
      const [emailInputLogin, setEmailInputLogin] = useState('');
      const [senhaAdminLogin, setSenhaAdminLogin] = useState('');
      const [erroSenhaAdmin, setErroSenhaAdmin] = useState(false);
      const [mensagemProcessamento, setMensagemProcessamento] = useState(false);
      const [novoEmailAcesso, setNovoEmailAcesso] = useState('');

      useEffect(() => {
        const docRef = db.collection('sistema_eed').doc('acessos');
        const unsub = docRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            const permitidos = data.permitidos || [ADMIN_SISTEMA];
            const pendentes = data.pendentes || [];
            
            if (!permitidos.map(u => u.toLowerCase()).includes(ADMIN_SISTEMA.toLowerCase())) {
              permitidos.unshift(ADMIN_SISTEMA);
            }
            setUsuariosPermitidos(permitidos);
            setSolicitacoesAcesso(pendentes);

            if (usuarioLogado && !permitidos.map(u => u.toLowerCase()).includes(usuarioLogado.toLowerCase())) {
              setUsuarioLogado(null);
              localStorage.removeItem('usuario_logado_eed_energisa_v2');
            }
          } else {
            docRef.set({ permitidos: [ADMIN_SISTEMA], pendentes: [] });
          }
        }, (err) => {
          console.error("Erro ao sincronizar acessos:", err);
        });
        return () => unsub();
      }, [usuarioLogado]);

      const ehAdministrador = useMemo(() => {
        return usuarioLogado && usuarioLogado.toLowerCase() === ADMIN_SISTEMA.toLowerCase();
      }, [usuarioLogado]);

      const processarEntradaUsuario = async (e) => {
        e.preventDefault();
        const emailNormalizado = emailInputLogin.trim().toLowerCase();
        if (!emailNormalizado) return;

        if (emailNormalizado === ADMIN_SISTEMA.toLowerCase()) {
          if (senhaAdminLogin.trim() !== SENHA_MESTRE_CORRETA) {
            setErroSenhaAdmin(true);
            return;
          }
          setErroSenhaAdmin(false);
          setUsuarioLogado(emailNormalizado);
          localStorage.setItem('usuario_logado_eed_energisa_v2', emailNormalizado);
          setMensagemProcessamento(false);
          setEmailInputLogin('');
          setSenhaAdminLogin('');
          dispararNotificacao('Acesso de Administrador liberado com sucesso!');
          return;
        }

        const docRef = db.collection('sistema_eed').doc('acessos');
        const doc = await docRef.get();
        let permitidos = [ADMIN_SISTEMA];
        let pendentes = [];

        if (doc.exists) {
          permitidos = doc.data().permitidos || [ADMIN_SISTEMA];
          pendentes = doc.data().pendentes || [];
        }

        if (permitidos.map(u => u.toLowerCase()).includes(emailNormalizado)) {
          setUsuarioLogado(emailNormalizado);
          localStorage.setItem('usuario_logado_eed_energisa_v2', emailNormalizado);
          setMensagemProcessamento(false);
          setEmailInputLogin('');
          dispararNotificacao('Acesso autorizado!');
        } else {
          if (!pendentes.includes(emailNormalizado)) {
            await docRef.set({
              permitidos,
              pendentes: [...pendentes, emailNormalizado]
            }, { merge: true });
          }
          setMensagemProcessamento(true);
        }
      };

      const encerrarSessao = () => {
        setUsuarioLogado(null);
        localStorage.removeItem('usuario_logado_eed_energisa_v2');
        setTelaAtual('capa');
        setMensagemProcessamento(false);
        dispararNotificacao('Sessão encerrada.');
      };

      const aprovarSolicitacao = async (emailAprovar) => {
        const docRef = db.collection('sistema_eed').doc('acessos');
        const novosPermitidos = Array.from(new Set([...usuariosPermitidos, emailAprovar.toLowerCase()]));
        const novosPendentes = solicitacoesAcesso.filter(e => e.toLowerCase() !== emailAprovar.toLowerCase());
        
        await docRef.update({
          permitidos: novosPermitidos,
          pendentes: novosPendentes
        });
        dispararNotificacao(`Acesso aprovado para ${emailAprovar}`);
      };

      const rejeitarSolicitacao = async (emailRejeitar) => {
        const docRef = db.collection('sistema_eed').doc('acessos');
        const novosPendentes = solicitacoesAcesso.filter(e => e.toLowerCase() !== emailRejeitar.toLowerCase());
        await docRef.update({ pendentes: novosPendentes });
        dispararNotificacao(`Solicitação de ${emailRejeitar} removida.`);
      };

      const liberarNovoAcessoManual = async (e) => {
        e.preventDefault();
        const email = novoEmailAcesso.trim().toLowerCase();
        if (!email) return;

        if (usuariosPermitidos.map(u => u.toLowerCase()).includes(email)) {
          dispararNotificacao('E-mail já cadastrado.', 'erro');
          return;
        }

        const docRef = db.collection('sistema_eed').doc('acessos');
        const novosPermitidos = [...usuariosPermitidos, email];
        const novosPendentes = solicitacoesAcesso.filter(e => e.toLowerCase() !== email);

        await docRef.update({
          permitidos: novosPermitidos,
          pendentes: novosPendentes
        });
        setNovoEmailAcesso('');
        dispararNotificacao('Acesso concedido com sucesso.');
      };

      const revogarAcesso = async (emailRemover) => {
        if (emailRemover.toLowerCase() === ADMIN_SISTEMA.toLowerCase()) {
          dispararNotificacao('Não é possível remover o acesso principal.', 'erro');
          return;
        }
        const docRef = db.collection('sistema_eed').doc('acessos');
        const novosPermitidos = usuariosPermitidos.filter(u => u.toLowerCase() !== emailRemover.toLowerCase());
        await docRef.update({ permitidos: novosPermitidos });
        dispararNotificacao('Acesso revogado.');
      };

      // ==========================================
      // ESTADOS DE ESTOQUE E SOLICITAÇÕES
      // ==========================================
      const [telaAtual, setTelaAtual] = useState('capa');
      const [materiais, setMateriais] = useState([]);
      const [solicitacoes, setSolicitacoes] = useState([]);

      useEffect(() => {
        const unsubEstoque = db.collection('estoque_eed').onSnapshot(snap => {
          const dados = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setMateriais(dados);
        });

        const unsubSolicitacoes = db.collection('solicitacoes_eed').onSnapshot(snap => {
          const dados = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setSolicitacoes(dados);
        });

        return () => {
          unsubEstoque();
          unsubSolicitacoes();
        };
      }, []);

      const [filtroEmpreiteira, setFiltroEmpreiteira] = useState('');
      const [filtroCodigoMaterial, setFiltroCodigoMaterial] = useState('');
      const [filtroDescSimplificada, setFiltroDescSimplificada] = useState('');
      const [filtroSaldoFisicoMaiorQue, setFiltroSaldoFisicoMaiorQue] = useState('');
      const [filtroCodDeposito, setFiltroCodDeposito] = useState('');
      const [filtroSupervisao, setFiltroSupervisao] = useState('');

      const [modalMaterialAberto, setModalMaterialAberto] = useState(false);
      const [materialEmEdicao, setMaterialEmEdicao] = useState(null);

      const [campoEmpreiteira, setCampoEmpreiteira] = useState('');
      const [campoCodigoMaterial, setCampoCodigoMaterial] = useState('');
      const [campoDescSimplificada, setCampoDescSimplificada] = useState('');
      const [campoSaldoFisico, setCampoSaldoFisico] = useState('');
      const [campoCodDeposito, setCampoCodDeposito] = useState('');
      const [campoSupervisao, setCampoSupervisao] = useState('');
      const [campoTipoDeposito, setCampoTipoDeposito] = useState('');
      const [campoMarcaEquipamento, setCampoMarcaEquipamento] = useState('');
      const [campoObservacao, setCampoObservacao] = useState('');

      const [modalSolicitacaoAberto, setModalSolicitacaoAberto] = useState(false);
      const [solicitacaoObra, setSolicitacaoObra] = useState('');
      const [solicitacaoSigco, setSolicitacaoSigco] = useState('');
      const [solicitacaoSupervisao, setSolicitacaoSupervisao] = useState('');
      const [solicitacaoLocalidade, setSolicitacaoLocalidade] = useState('');
      const [solicitacaoEmpreiteira, setSolicitacaoEmpreiteira] = useState('');
      const [solicitacaoDataProgramacao, setSolicitacaoDataProgramacao] = useState('');
      const [solicitacaoObservacao, setSolicitacaoObservacao] = useState('');
      const [listaItensSolicitacao, setListaItensSolicitacao] = useState([{ material: '', quantidade: 1 }]);

      const [modalSenhaAberto, setModalSenhaAberto] = useState(false);
      const [senhaDigitada, setSenhaDigitada] = useState('');
      const [exibirErroSenha, setExibirErroSenha] = useState(false);
      const [acaoProtegida, setAcaoProtegida] = useState(null);
      const [idItemParaExcluir, setIdItemParaExcluir] = useState(null);
      const [notificacao, setNotificacao] = useState(null);

      const dispararNotificacao = (mensagem, tipo = 'sucesso') => {
        setNotificacao({ mensagem, tipo });
        setTimeout(() => setNotificacao(null), 4000);
      };

      const atualizarStatusSolicitacao = async (id, novoStatus) => {
        const carimbo = gerarCarimboAuditoria(usuarioLogado);
        await db.collection('solicitacoes_eed').doc(id).update({
          status: novoStatus,
          ultimaAlteracao: carimbo
        });
        dispararNotificacao('Status atualizado!');
      };

      const atualizarCodigoEMD = async (id, codigo) => {
        const carimbo = gerarCarimboAuditoria(usuarioLogado);
        await db.collection('solicitacoes_eed').doc(id).update({
          codigoEMD: codigo,
          ultimaAlteracao: carimbo
        });
      };

      const abrirModalNovaSolicitacao = () => {
        setSolicitacaoObra('');
        setSolicitacaoSigco('');
        setSolicitacaoSupervisao('');
        setSolicitacaoLocalidade('');
        setSolicitacaoEmpreiteira('');
        setSolicitacaoDataProgramacao('');
        setSolicitacaoObservacao('');
        setListaItensSolicitacao([{ material: '', quantidade: 1 }]);
        setModalSolicitacaoAberto(true);
      };

      const adicionarLinhaMaterial = () => setListaItensSolicitacao(prev => [...prev, { material: '', quantidade: 1 }]);
      const removerLinhaMaterial = (index) => {
        if (listaItensSolicitacao.length === 1) return;
        setListaItensSolicitacao(prev => prev.filter((_, i) => i !== index));
      };
      const atualizarItemMaterial = (index, campo, valor) => {
        setListaItensSolicitacao(prev => {
          const itens = [...prev];
          itens[index][campo] = valor;
          return itens;
        });
      };

      const salvarSolicitacao = async (e) => {
        e.preventDefault();
        const itensValidos = listaItensSolicitacao.filter(item => item.material.trim() !== '');
        
        if (itensValidos.length === 0) {
          dispararNotificacao('Informe ao menos um EED.', 'erro');
          return;
        }

        const nomes = itensValidos.map(item => item.material.trim().toLowerCase());
        if (nomes.some((n, idx) => nomes.indexOf(n) !== idx)) {
          dispararNotificacao('Não é permitido adicionar o mesmo EED duplicado.', 'erro');
          return;
        }

        const carimbo = gerarCarimboAuditoria(usuarioLogado);
        const novaSolicitacao = {
          solicitante: usuarioLogado,
          dataRegistro: new Date().toLocaleDateString('pt-BR'),
          dataHoraCriacao: new Date().toISOString(),
          obra: solicitacaoObra.trim(),
          sigco: solicitacaoSigco.trim(),
          supervisao: solicitacaoSupervisao.trim(),
          localidade: solicitacaoLocalidade.trim(),
          nomeEmpreiteira: solicitacaoEmpreiteira.trim(),
          dataProgramacao: solicitacaoDataProgramacao,
          observacao: solicitacaoObservacao.trim(),
          materiais: itensValidos,
          status: 'Solicitado',
          codigoEMD: '',
          ultimaAlteracao: carimbo
        };

        await db.collection('solicitacoes_eed').add(novaSolicitacao);
        setModalSolicitacaoAberto(false);
        dispararNotificacao('Solicitação gravada com sucesso!');
      };

      const salvarMaterial = async (e) => {
        e.preventDefault();
        const cod = campoCodigoMaterial.trim().toLowerCase();
        const emp = campoEmpreiteira.trim().toLowerCase();
        const dep = campoCodDeposito.trim().toLowerCase();

        const jaExiste = materiais.some(item => {
          if (materialEmEdicao && item.id === materialEmEdicao.id) return false;
          return (item.codigoMaterial || '').toLowerCase() === cod &&
                 (item.empreiteira || '').toLowerCase() === emp &&
                 (item.codDeposito || '').toLowerCase() === dep;
        });

        if (jaExiste) {
          dispararNotificacao('Material já cadastrado para este depósito e empreiteira.', 'erro');
          return;
        }

        const carimbo = gerarCarimboAuditoria(usuarioLogado);
        const dados = {
          empreiteira: campoEmpreiteira.trim(),
          codigoMaterial: campoCodigoMaterial.trim(),
          descSimplificada: campoDescSimplificada.trim(),
          saldoFisico: Number(campoSaldoFisico),
          codDeposito: campoCodDeposito.trim(),
          supervisao: campoSupervisao.trim(),
          tipoDeposito: campoTipoDeposito.trim(),
          marcaEquipamento: campoMarcaEquipamento.trim(),
          observacao: campoObservacao.trim(),
          ultimaAlteracao: carimbo
        };

        if (materialEmEdicao) {
          await db.collection('estoque_eed').doc(materialEmEdicao.id).update(dados);
          dispararNotificacao('Material atualizado!');
        } else {
          await db.collection('estoque_eed').add(dados);
          dispararNotificacao('Material cadastrado no estoque!');
        }
        setModalMaterialAberto(false);
      };

      const processarArquivoExcel = (e) => {
        const arquivo = e.target.files[0];
        if (!arquivo) return;
        const leitor = new FileReader();
        leitor.onload = async (evento) => {
          try {
            const bin = evento.target.result;
            const pasta = XLSX.read(bin, { type: 'binary' });
            const aba = pasta.Sheets[pasta.SheetNames[0]];
            const linhas = XLSX.utils.sheet_to_json(aba);
            if (!linhas || linhas.length === 0) {
              dispararNotificacao('A planilha está vazia.', 'erro');
              return;
            }
            const carimbo = gerarCarimboAuditoria(usuarioLogado);
            const batch = db.batch();

            linhas.forEach((linha, index) => {
              const docRef = db.collection('estoque_eed').doc();
              batch.set(docRef, {
                empreiteira: String(linha['Empreiteira'] || 'Geral').trim(),
                codigoMaterial: String(linha['Código Material'] || linha['Código do Material'] || `69000${index + 1}`).trim(),
                descSimplificada: String(linha['Descrição Simplificada'] || linha['Desc Material'] || 'Item sem descrição').trim(),
                saldoFisico: Number(linha['Saldo Físico'] || linha['Quantidade'] || 0),
                codDeposito: String(linha['Cod Depósito'] || '0001').trim(),
                supervisao: String(linha['Supervisão'] || '').trim(),
                tipoDeposito: String(linha['Tipo Depósito'] || 'Almoxarifado').trim(),
                marcaEquipamento: String(linha['Marca'] || '').trim(),
                observacao: String(linha['Observação'] || '').trim(),
                ultimaAlteracao: carimbo
              });
            });

            await batch.commit();
            dispararNotificacao(`Importados ${linhas.length} itens com sucesso!`);
          } catch (err) {
            dispararNotificacao('Erro ao processar arquivo.', 'erro');
          } finally {
            e.target.value = '';
          }
        };
        leitor.readAsBinaryString(arquivo);
      };

      const solicitarSenhaParaAcao = (tipoAcao, idItem = null) => {
        setAcaoProtegida(tipoAcao);
        setIdItemParaExcluir(idItem);
        setSenhaDigitada('');
        setExibirErroSenha(false);
        setModalSenhaAberto(true);
      };

      const validarSenhaEExecutar = (e) => {
        e.preventDefault();
        if (senhaDigitada.trim() !== SENHA_MESTRE_CORRETA) {
          setExibirErroSenha(true);
          return;
        }

        const acao = acaoProtegida;
        const idExcluir = idItemParaExcluir;
        setModalSenhaAberto(false);

        if (acao === 'excluir' && idExcluir) {
          db.collection('estoque_eed').doc(idExcluir).delete();
          dispararNotificacao('Material excluído do estoque!');
        } else if (acao === 'excluir_solicitacao' && idExcluir) {
          db.collection('solicitacoes_eed').doc(idExcluir).delete();
          dispararNotificacao('Solicitação excluída com sucesso!');
        } else if (acao === 'extrair') {
          executarExtracaoExcel();
        } else if (acao === 'inserir' && inputArquivoExcelRef.current) {
          inputArquivoExcelRef.current.click();
        }
      };

      const executarExtracaoExcel = () => {
        if (materiaisFiltrados.length === 0) return dispararNotificacao('Sem dados para exportar.', 'erro');
        const dadosFormatados = materiaisFiltrados.map(item => ({
          'Empreiteira': item.empreiteira,
          'Código Material': item.codigoMaterial,
          'Descrição Simplificada': item.descSimplificada,
          'Saldo Físico': item.saldoFisico,
          'Cod Depósito': item.codDeposito,
          'Supervisão': item.supervisao,
          'Tipo Depósito': item.tipoDeposito,
          'Marca': item.marcaEquipamento || '',
          'Última Alteração': item.ultimaAlteracao || '—',
          'Observação': item.observacao || ''
        }));
        const folha = XLSX.utils.json_to_sheet(dadosFormatados);
        const pasta = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(pasta, folha, "Estoque");
        XLSX.writeFile(pasta, `estoque_eed_${new Date().toISOString().split('T')[0]}.xlsx`);
        dispararNotificacao('Planilha exportada com sucesso!');
      };

      const exportarSolicitacoesExcel = () => {
        if (solicitacoes.length === 0) return dispararNotificacao('Sem solicitações.', 'erro');
        const dados = [];
        solicitacoes.forEach(sol => {
          sol.materiais.forEach(m => {
            dados.push({
              'Data Registro': sol.dataRegistro,
              'Solicitante': sol.solicitante,
              'Obra': sol.obra,
              'Sigco': sol.sigco,
              'Supervisão': sol.supervisao || '',
              'Localidade': sol.localidade || '',
              'Empreiteira': sol.nomeEmpreiteira,
              'Data Programação': sol.dataProgramacao,
              'EED Solicitado': m.material,
              'Quantidade': m.quantidade,
              'Status': sol.status || 'Solicitado',
              'Código EMD': sol.codigoEMD || '',
              'Última Alteração': sol.ultimaAlteracao || '—',
              'Observação': sol.observacao
            });
          });
        });
        const folha = XLSX.utils.json_to_sheet(dados);
        const pasta = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(pasta, folha, "Solicitacoes");
        XLSX.writeFile(pasta, `solicitacoes_eed_${new Date().toISOString().split('T')[0]}.xlsx`);
        dispararNotificacao('Solicitações exportadas com sucesso!');
      };

      const materiaisFiltrados = useMemo(() => {
        return materiais.filter((item) => {
          const atendeEmp = (item.empreiteira || '').toLowerCase().includes(filtroEmpreiteira.toLowerCase());
          const atendeCod = (item.codigoMaterial || '').toLowerCase().includes(filtroCodigoMaterial.toLowerCase());
          const atendeDesc = (item.descSimplificada || '').toLowerCase().includes(filtroDescSimplificada.toLowerCase());
          const atendeDep = (item.codDeposito || '').toLowerCase().includes(filtroCodDeposito.toLowerCase());
          const atendeSup = (item.supervisao || '').toLowerCase().includes(filtroSupervisao.toLowerCase());
          let atendeSaldo = true;
          if (filtroSaldoFisicoMaiorQue !== '') {
            const v = Number(filtroSaldoFisicoMaiorQue);
            if (!isNaN(v)) atendeSaldo = item.saldoFisico > v;
          }
          return atendeEmp && atendeCod && atendeDesc && atendeDep && atendeSup && atendeSaldo;
        });
      }, [materiais, filtroEmpreiteira, filtroCodigoMaterial, filtroDescSimplificada, filtroSaldoFisicoMaiorQue, filtroCodDeposito, filtroSupervisao]);

      const abrirModalAdicionar = () => {
        setMaterialEmEdicao(null);
        setCampoEmpreiteira('');
        setCampoCodigoMaterial('');
        setCampoDescSimplificada('');
        setCampoSaldoFisico('');
        setCampoCodDeposito('');
        setCampoSupervisao('');
        setCampoTipoDeposito('');
        setCampoMarcaEquipamento('');
        setCampoObservacao('');
        setModalMaterialAberto(true);
      };

      const abrirModalEditar = (item) => {
        setMaterialEmEdicao(item);
        setCampoEmpreiteira(item.empreiteira || '');
        setCampoCodigoMaterial(item.codigoMaterial || '');
        setCampoDescSimplificada(item.descSimplificada || '');
        setCampoSaldoFisico(item.saldoFisico);
        setCampoCodDeposito(item.codDeposito || '');
        setCampoSupervisao(item.supervisao || '');
        setCampoTipoDeposito(item.tipoDeposito || '');
        setCampoMarcaEquipamento(item.marcaEquipamento || '');
        setCampoObservacao(item.observacao || '');
        setModalMaterialAberto(true);
      };

      const obterBadgeStatus = (status) => {
        switch (status) {
          case 'Aprovado': return 'bg-emerald-950/80 text-emerald-300 border-emerald-500/50';
          case 'Reprovado': return 'bg-rose-950/80 text-rose-300 border-rose-500/50';
          case 'EMD gerada (Concluido)': return 'bg-cyan-950/80 text-cyan-300 border-cyan-500/50';
          default: return 'bg-[#0B3A4A]/80 text-cyan-200 border-cyan-700/60';
        }
      };

      // =======================================================================
      // TELA DE BLOQUEIO INICIAL
      // =======================================================================
      if (!usuarioLogado) {
        const digitouAdmin = emailInputLogin.trim().toLowerCase() === ADMIN_SISTEMA.toLowerCase();

        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            {notificacao && (
              <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl text-xs font-semibold shadow-2xl border transition-all ${
                notificacao.tipo === 'sucesso' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-300' : 'bg-rose-950/90 border-rose-500 text-rose-300'
              }`}>
                {notificacao.mensagem}
              </div>
            )}

            <div className="bg-[#051622]/95 border border-cyan-800/50 rounded-3xl p-8 sm:p-10 max-w-md w-full shadow-2xl space-y-6 text-center backdrop-blur-md">
              <div className="flex flex-col items-center">
                <div className="w-16 h-16 rounded-2xl bg-[#030D14] border border-cyan-700/40 flex items-center justify-center p-2 shadow-inner mb-3">
                  <IconeSimboloEnergisa className="w-12 h-12" />
                </div>
                <h1 className="text-xl font-extrabold text-white">Acesso Restrito</h1>
                <p className="text-xs text-zinc-300 mt-1">
                  Informe seu e-mail corporativo para solicitar ou validar o acesso ao sistema.
                </p>
              </div>

              {mensagemProcessamento ? (
                <div className="bg-[#030D14]/90 border border-emerald-500/50 rounded-2xl p-5 text-center space-y-3">
                  <span className="text-2xl">⏳</span>
                  <h3 className="text-sm font-bold text-white">Solicitação enviada</h3>
                  <p className="text-xs text-emerald-300 font-medium">
                    "Sua solicitação está sendo processada, volte mais tarde."
                  </p>
                  <p className="text-[11px] text-zinc-400">
                    O acesso foi registrado e aguarda liberação pelo administrador.
                  </p>
                  <button
                    type="button"
                    onClick={() => {
                      setMensagemProcessamento(false);
                      setEmailInputLogin('');
                      setSenhaAdminLogin('');
                    }}
                    className="mt-2 px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-cyan-600 hover:opacity-90 text-white font-semibold text-xs transition"
                  >
                    Tentar Novamente
                  </button>
                </div>
              ) : (
                <form onSubmit={processarEntradaUsuario} className="space-y-4">
                  <div className="space-y-3 text-left">
                    <div>
                      <label className="text-[11px] font-semibold text-zinc-300 block mb-1">E-mail de Acesso:</label>
                      <input
                        type="email"
                        required
                        autoFocus
                        value={emailInputLogin}
                        onChange={(e) => {
                          setEmailInputLogin(e.target.value);
                          setErroSenhaAdmin(false);
                        }}
                        placeholder="seuemail@energisa.com.br"
                        className="w-full h-11 px-4 rounded-xl bg-[#030D14]/90 border border-cyan-800/60 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-400"
                      />
                    </div>

                    {digitouAdmin && (
                      <div className="pt-1">
                        <label className="text-[11px] font-semibold text-emerald-300 block mb-1">Senha Chave (Usuário Master):</label>
                        <input
                          type="password"
                          required
                          value={senhaAdminLogin}
                          onChange={(e) => {
                            setSenhaAdminLogin(e.target.value);
                            setErroSenhaAdmin(false);
                          }}
                          placeholder="Digite a senha chave..."
                          className="w-full h-11 px-4 text-center tracking-widest text-lg font-bold rounded-xl bg-[#030D14]/90 border border-emerald-500 text-white focus:outline-none focus:border-cyan-400"
                        />
                        {erroSenhaAdmin && (
                          <p className="text-[11px] text-rose-400 text-center mt-1">Senha chave incorreta!</p>
                        )}
                      </div>
                    )}
                  </div>

                  <button
                    type="submit"
                    className="w-full h-11 rounded-xl bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-600 hover:from-emerald-600 hover:to-cyan-700 text-white font-bold text-sm transition shadow-lg shadow-cyan-900/30 active:scale-95"
                  >
                    {digitouAdmin ? 'Entrar como Administrador' : 'Acessar / Solicitar Acesso'}
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // =======================================================================
      // APLICAÇÃO PRINCIPAL COM A NOVA PALETA
      // =======================================================================
      return (
        <div className="min-h-screen flex flex-col">
          {notificacao && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl text-xs font-semibold shadow-2xl border transition-all ${
              notificacao.tipo === 'sucesso' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-300' : 'bg-rose-950/90 border-rose-500 text-rose-300'
            }`}>
              {notificacao.mensagem}
            </div>
          )}

          {/* HEADER */}
          <header className="border-b border-cyan-800/40 bg-[#04121A]/90 px-4 sm:px-8 py-3.5 flex items-center justify-between sticky top-0 z-30 backdrop-blur-md">
            <button type="button" onClick={() => setTelaAtual('capa')} className="flex items-center gap-3 hover:opacity-90 transition text-left">
              <div className="w-8 h-8 rounded-lg bg-[#030D14] border border-cyan-700/40 flex items-center justify-center p-1 shadow-md">
                <IconeSimboloEnergisa className="w-6 h-6" />
              </div>
              <span className="font-extrabold text-white text-sm sm:text-base tracking-wide">
                Controle e solicitação de EED
              </span>
            </button>
            <div className="flex items-center gap-3 text-xs">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="text-zinc-300 hidden md:inline">{usuarioLogado}</span>
              <button
                type="button"
                onClick={encerrarSessao}
                className="px-2.5 py-1 rounded-lg bg-rose-950/50 hover:bg-rose-900 border border-rose-800/50 text-rose-300 text-xs font-medium transition"
              >
                Sair
              </button>
            </div>
          </header>

          {/* VISTA 1: CAPA */}
          {telaAtual === 'capa' && (
            <main className="flex-1 flex flex-col items-center justify-center p-6 sm:p-10 max-w-5xl mx-auto w-full space-y-8">
              <div className="w-full rounded-3xl overflow-hidden shadow-2xl border border-cyan-700/40 bg-gradient-to-br from-[#063342]/90 via-[#04202B]/90 to-[#020F17]/90 p-10 text-center backdrop-blur-md">
                <span className="text-[11px] font-bold tracking-widest text-emerald-400 uppercase bg-emerald-950/60 border border-emerald-500/30 px-3.5 py-1 rounded-full inline-block mb-3">
                  Gestão Operacional
                </span>
                <h1 className="text-2xl sm:text-4xl font-extrabold text-white">Controle e solicitação de EED</h1>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 w-full">
                <button type="button" onClick={() => setTelaAtual('controle')} className="bg-[#051A24]/90 hover:bg-[#093547]/60 border border-cyan-800/60 hover:border-emerald-400/80 p-8 rounded-2xl transition text-center space-y-3 shadow-xl flex flex-col items-center justify-center backdrop-blur-md group">
                  <span className="text-4xl">📦</span>
                  <h2 className="text-lg font-bold text-white group-hover:text-emerald-300 transition">Controle</h2>
                </button>

                <button type="button" onClick={() => setTelaAtual('solicitacao')} className="bg-[#051A24]/90 hover:bg-[#093547]/60 border border-cyan-800/60 hover:border-emerald-400/80 p-8 rounded-2xl transition text-center space-y-3 shadow-xl flex flex-col items-center justify-center backdrop-blur-md group">
                  <span className="text-4xl">📋</span>
                  <h2 className="text-lg font-bold text-white group-hover:text-emerald-300 transition">Solicitação</h2>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    if (!ehAdministrador) return dispararNotificacao('Acesso restrito ao administrador.', 'erro');
                    setTelaAtual('gerenciar');
                  }}
                  className="bg-[#051A24]/90 hover:bg-[#093547]/60 border border-cyan-800/60 hover:border-emerald-400/80 p-8 rounded-2xl transition text-center space-y-3 shadow-xl flex flex-col items-center justify-center relative backdrop-blur-md group"
                >
                  <span className="text-4xl">🔒</span>
                  <h2 className="text-lg font-bold text-white group-hover:text-emerald-300 transition">Gerenciar Acesso</h2>
                  {ehAdministrador && solicitacoesAcesso.length > 0 && (
                    <span className="absolute top-4 right-4 bg-emerald-500 text-black text-[10px] font-extrabold px-2 py-0.5 rounded-full animate-bounce">
                      {solicitacoesAcesso.length} pendente(s)
                    </span>
                  )}
                </button>
              </div>
            </main>
          )}

          {/* VISTA 2: CONTROLE (ESTOQUE) */}
          {telaAtual === 'controle' && (
            <main className="flex-1 p-4 sm:p-8 max-w-7xl mx-auto w-full space-y-6">
              <div className="flex flex-wrap items-center justify-between gap-4 border-b border-cyan-800/40 pb-4">
                <div className="flex items-center gap-3">
                  <button type="button" onClick={() => setTelaAtual('capa')} className="p-2 rounded-xl bg-cyan-950/60 hover:bg-cyan-900 border border-cyan-800 text-zinc-200 text-xs">← Voltar</button>
                  <h2 className="text-lg font-bold text-white">Controle de Estoque</h2>
                </div>
                <div className="flex items-center gap-2 flex-wrap">
                  <input type="file" ref={inputArquivoExcelRef} onChange={processarArquivoExcel} accept=".xlsx, .xls, .csv" className="hidden" />
                  <button type="button" onClick={abrirModalAdicionar} className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xs shadow-md shadow-emerald-950/50">+ Adicionar Item</button>
                  <button type="button" onClick={() => solicitarSenhaParaAcao('inserir')} className="px-3 py-2 rounded-xl bg-teal-900/80 hover:bg-teal-800 text-teal-100 font-semibold text-xs border border-teal-600/50">↑ Inserir Base</button>
                  <button type="button" onClick={() => solicitarSenhaParaAcao('extrair')} className="px-3 py-2 rounded-xl bg-cyan-950/80 hover:bg-cyan-900 text-cyan-200 font-semibold text-xs border border-cyan-700/60">↓ Extrair Base</button>
                </div>
              </div>

              {/* Filtros */}
              <div className="bg-[#051A24]/90 border border-cyan-800/50 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 text-xs backdrop-blur-md">
                <div>
                  <label className="text-zinc-400 block mb-1">Empreiteira</label>
                  <input type="text" value={filtroEmpreiteira} onChange={(e) => setFiltroEmpreiteira(e.target.value)} placeholder="Buscar..." className="w-full h-8 px-3 rounded-lg bg-[#030D14]/90 border border-cyan-800/60 text-white focus:outline-none focus:border-emerald-400" />
                </div>
                <div>
                  <label className="text-zinc-400 block mb-1">Código Material</label>
                  <input type="text" value={filtroCodigoMaterial} onChange={(e) => setFiltroCodigoMaterial(e.target.value)} placeholder="Buscar..." className="w-full h-8 px-3 rounded-lg bg-[#030D14]/90 border border-cyan-800/60 text-white focus:outline-none focus:border-emerald-400" />
                </div>
                <div>
                  <label className="text-zinc-400 block mb-1">Descrição</label>
                  <input type="text" value={filtroDescSimplificada} onChange={(e) => setFiltroDescSimplificada(e.target.value)} placeholder="Buscar..." className="w-full h-8 px-3 rounded-lg bg-[#030D14]/90 border border-cyan-800/60 text-white focus:outline-none focus:border-emerald-400" />
                </div>
                <div>
                  <label className="text-zinc-400 block mb-1">Saldo Físico &gt;</label>
                  <input type="number" value={filtroSaldoFisicoMaiorQue} onChange={(e) => setFiltroSaldoFisicoMaiorQue(e.target.value)} placeholder="0" className="w-full h-8 px-3 rounded-lg bg-[#030D14]/90 border border-cyan-800/60 text-white focus:outline-none focus:border-emerald-400" />
                </div>
              </div>

              {/* Tabela */}
              <div className="bg-[#051A24]/90 border border-cyan-800/40 rounded-2xl overflow-hidden shadow-xl backdrop-blur-md">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-zinc-200">
                    <thead className="bg-[#062635]/70 uppercase text-[10px] tracking-wider text-cyan-200 border-b border-cyan-800/40 font-semibold">
                      <tr>
                        <th className="py-3 px-3">Empreiteira</th>
                        <th className="py-3 px-3">Código</th>
                        <th className="py-3 px-3">Descrição</th>
                        <th className="py-3 px-3 text-center">Saldo</th>
                        <th className="py-3 px-3">Depósito</th>
                        <th className="py-3 px-3">Supervisão</th>
                        <th className="py-3 px-3">Marca</th>
                        <th className="py-3 px-3">Última Alteração</th>
                        <th className="py-3 px-3 text-right">Ações</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-cyan-900/30">
                      {materiaisFiltrados.length === 0 ? (
                        <tr><td colSpan="9" className="py-8 text-center text-zinc-400 italic">Nenhum material cadastrado.</td></tr>
                      ) : (
                        materiaisFiltrados.map((item) => (
                          <tr key={item.id} className="hover:bg-cyan-950/40 transition-colors">
                            <td className="py-3 px-3 font-medium text-zinc-300">{item.empreiteira}</td>
                            <td className="py-3 px-3"><span className="px-2 py-0.5 rounded bg-[#030D14] text-emerald-400 font-mono border border-cyan-800/60">{item.codigoMaterial}</span></td>
                            <td className="py-3 px-3 font-semibold text-white">{item.descSimplificada}</td>
                            <td className="py-3 px-3 text-center font-bold text-cyan-300">{item.saldoFisico}</td>
                            <td className="py-3 px-3 font-mono">{item.codDeposito || '—'}</td>
                            <td className="py-3 px-3">{item.supervisao || '—'}</td>
                            <td className="py-3 px-3">{item.marcaEquipamento || '—'}</td>
                            <td className="py-3 px-3"><span className="text-[11px] text-teal-300/90 font-mono bg-[#030D14] px-2 py-0.5 rounded border border-cyan-900/50">{item.ultimaAlteracao || '—'}</span></td>
                            <td className="py-3 px-3 text-right space-x-1">
                              <button type="button" onClick={() => abrirModalEditar(item)} className="px-2 py-1 rounded bg-cyan-950/60 hover:bg-cyan-900 text-cyan-200 border border-cyan-800 text-xs">Editar</button>
                              <button type="button" onClick={() => solicitarSenhaParaAcao('excluir', item.id)} className="px-2 py-1 rounded bg-rose-950/40 hover:bg-rose-900 border border-rose-800 text-rose-300 text-xs">Excluir</button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          )}

          {/* VISTA 3: SOLICITAÇÕES */}
          {telaAtual === 'solicitacao' && (
            <main className="flex-1 p-4 sm:p-8 max-w-7xl mx-auto w-full space-y-6">
              <div className="flex flex-wrap items-center justify-between gap-4 border-b border-cyan-800/40 pb-4">
                <div className="flex items-center gap-3">
                  <button type="button" onClick={() => setTelaAtual('capa')} className="p-2 rounded-xl bg-cyan-950/60 hover:bg-cyan-900 border border-cyan-800 text-zinc-200 text-xs">← Voltar</button>
                  <h2 className="text-lg font-bold text-white">Solicitações de Material</h2>
                </div>
                <div className="flex items-center gap-2">
                  <button type="button" onClick={abrirModalNovaSolicitacao} className="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xs shadow-md shadow-emerald-950/50">+ Nova Solicitação</button>
                  {solicitacoes.length > 0 && (
                    <button type="button" onClick={exportarSolicitacoesExcel} className="px-3 py-2 rounded-xl bg-cyan-950/80 hover:bg-cyan-900 text-cyan-200 font-semibold text-xs border border-cyan-700/60">Exportar (.xlsx)</button>
                  )}
                </div>
              </div>

              {solicitacoes.length === 0 ? (
                <div className="bg-[#051A24]/90 border border-cyan-800/40 rounded-2xl p-12 text-center space-y-3 backdrop-blur-md">
                  <span className="text-3xl">📋</span>
                  <h3 className="text-sm font-bold text-white">Nenhuma solicitação registrada</h3>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {solicitacoes.map((sol) => (
                    <div key={sol.id} className="bg-[#051A24]/90 border border-cyan-800/60 rounded-2xl p-4 space-y-3.5 shadow-lg text-xs flex flex-col justify-between backdrop-blur-md">
                      <div className="space-y-2.5">
                        <div className="flex justify-between items-start border-b border-cyan-800/40 pb-2">
                          <div>
                            <span className="font-bold text-white text-sm">{sol.nomeEmpreiteira}</span>
                            <p className="text-[11px] text-zinc-400 mt-0.5">Obra: <strong className="text-zinc-200">{sol.obra}</strong> | SIGCO: <strong className="text-emerald-400">{sol.sigco}</strong></p>
                          </div>
                          <button type="button" onClick={() => solicitarSenhaParaAcao('excluir_solicitacao', sol.id)} className="p-1 px-1.5 rounded bg-rose-950/40 hover:bg-rose-900 border border-rose-800 text-rose-300 text-[11px]">🗑️ Excluir</button>
                        </div>
                        <div className="space-y-1">
                          <span className="text-[10px] uppercase font-bold text-cyan-300">EED SOLICITADO:</span>
                          {sol.materiais.map((item, idx) => (
                            <div key={idx} className="flex justify-between items-center bg-[#030D14]/90 p-2 rounded-lg border border-cyan-900/40">
                              <span className="text-zinc-200 truncate">{item.material}</span>
                              <span className="text-emerald-400 font-bold ml-2">Qtd: {item.quantidade}</span>
                            </div>
                          ))}
                        </div>
                        {sol.observacao && <p className="text-[11px] text-zinc-400 italic bg-[#030D14]/90 p-2 rounded-lg border border-cyan-950">"{sol.observacao}"</p>}
                      </div>

                      <div className="pt-2 border-t border-cyan-800/40 space-y-2">
                        <select
                          value={sol.status || 'Solicitado'}
                          onChange={(e) => atualizarStatusSolicitacao(sol.id, e.target.value)}
                          className={`w-full h-8 px-2.5 rounded-lg border text-xs font-semibold ${obterBadgeStatus(sol.status || 'Solicitado')}`}
                        >
                          <option value="Solicitado" className="bg-[#04121A] text-white">Solicitado</option>
                          <option value="Aprovado" className="bg-[#04121A] text-emerald-300">Aprovado</option>
                          <option value="Reprovado" className="bg-[#04121A] text-rose-300">Reprovado</option>
                          <option value="EMD gerada (Concluido)" className="bg-[#04121A] text-cyan-300">EMD gerada (Concluído)</option>
                        </select>

                        {sol.status === 'EMD gerada (Concluido)' && (
                          <input
                            type="text"
                            value={sol.codigoEMD || ''}
                            onChange={(e) => atualizarCodigoEMD(sol.id, e.target.value)}
                            placeholder="Número da EMD..."
                            className="w-full h-7 px-2.5 rounded-lg bg-[#030D14] border border-cyan-500/50 text-white text-xs"
                          />
                        )}
                        <div className="text-[10px] text-zinc-400 flex justify-between">
                          <span>Solicitante: {sol.solicitante ? sol.solicitante.split('@')[0] : '—'}</span>
                          <span className="text-teal-300/90">{sol.ultimaAlteracao || '—'}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* VISTA 4: GERENCIAR ACESSO */}
          {telaAtual === 'gerenciar' && ehAdministrador && (
            <main className="flex-1 p-4 sm:p-8 max-w-3xl mx-auto w-full space-y-6">
              <div className="flex items-center gap-3 border-b border-cyan-800/40 pb-4">
                <button type="button" onClick={() => setTelaAtual('capa')} className="p-2 rounded-xl bg-cyan-950/60 hover:bg-cyan-900 border border-cyan-800 text-zinc-200 text-xs">← Voltar</button>
                <h2 className="text-lg font-bold text-white">Gerenciar e Liberar Acesso</h2>
              </div>

              {/* Solicitações Pendentes */}
              <div className="bg-[#051A24]/90 border border-emerald-500/50 rounded-2xl p-5 space-y-3 backdrop-blur-md">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-white flex items-center gap-2">
                    <span>📩</span>
                    <span>Solicitações de Acesso Pendentes</span>
                  </span>
                  <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold border border-emerald-500/40">
                    {solicitacoesAcesso.length} pendente(s)
                  </span>
                </div>

                {solicitacoesAcesso.length === 0 ? (
                  <p className="text-xs text-zinc-400 italic py-2">Nenhuma solicitação pendente no momento.</p>
                ) : (
                  <div className="space-y-2 pt-1">
                    {solicitacoesAcesso.map((emailPend) => (
                      <div key={emailPend} className="flex items-center justify-between p-3 rounded-xl bg-[#030D14]/90 border border-cyan-800/60 text-xs">
                        <span className="font-medium text-white">{emailPend}</span>
                        <div className="flex items-center gap-2">
                          <button type="button" onClick={() => aprovarSolicitacao(emailPend)} className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs">Aprovar</button>
                          <button type="button" onClick={() => rejeitarSolicitacao(emailPend)} className="px-3 py-1.5 rounded-lg bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800 text-xs">Recusar</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Liberar Manual */}
              <form onSubmit={liberarNovoAcessoManual} className="space-y-3 bg-[#051A24]/90 p-5 rounded-2xl border border-cyan-800/60 backdrop-blur-md">
                <label className="text-xs font-bold text-white block">Liberar Novo Acesso Manualmente:</label>
                <div className="flex gap-2">
                  <input
                    type="email"
                    required
                    value={novoEmailAcesso}
                    onChange={(e) => setNovoEmailAcesso(e.target.value)}
                    placeholder="usuario@energisa.com.br"
                    className="flex-1 h-10 px-3.5 rounded-xl bg-[#030D14]/90 border border-cyan-800/60 text-xs text-white focus:outline-none focus:border-emerald-400"
                  />
                  <button type="submit" className="px-5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-90 text-white font-bold text-xs">Liberar</button>
                </div>
              </form>

              {/* Lista Autorizados */}
              <div className="bg-[#051A24]/90 border border-cyan-800/40 rounded-2xl p-5 space-y-3 backdrop-blur-md">
                <span className="text-xs font-bold text-cyan-200 block">Usuários Atualmente Autorizados ({usuariosPermitidos.length}):</span>
                <div className="space-y-2">
                  {usuariosPermitidos.map((user) => (
                    <div key={user} className="flex items-center justify-between p-3 rounded-xl bg-[#030D14]/90 border border-cyan-900/50 text-xs">
                      <span className="font-medium text-zinc-200">{user}</span>
                      {user.toLowerCase() !== ADMIN_SISTEMA.toLowerCase() ? (
                        <button type="button" onClick={() => revogarAcesso(user)} className="px-3 py-1 rounded-lg bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800 text-xs">Revogar</button>
                      ) : (
                        <span className="text-[10px] text-emerald-400 uppercase font-semibold">Master</span>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* MODAL: NOVA SOLICITAÇÃO */}
          {modalSolicitacaoAberto && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm">
              <div className="bg-[#051A24] border border-cyan-700/60 rounded-2xl p-6 max-w-2xl w-full shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-cyan-800/40 pb-3">
                  <h3 className="font-bold text-base text-white">📋 Solicitação de Material</h3>
                  <button type="button" onClick={() => setModalSolicitacaoAberto(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={salvarSolicitacao} className="space-y-4 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Obra *</label>
                      <input type="text" required value={solicitacaoObra} onChange={(e) => setSolicitacaoObra(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Sigco *</label>
                      <input type="text" required value={solicitacaoSigco} onChange={(e) => setSolicitacaoSigco(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Supervisão *</label>
                      <input type="text" required value={solicitacaoSupervisao} onChange={(e) => setSolicitacaoSupervisao(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Localidade *</label>
                      <input type="text" required value={solicitacaoLocalidade} onChange={(e) => setSolicitacaoLocalidade(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Nome da Empreiteira *</label>
                      <input type="text" required value={solicitacaoEmpreiteira} onChange={(e) => setSolicitacaoEmpreiteira(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Data de Programação *</label>
                      <input type="date" required value={solicitacaoDataProgramacao} onChange={(e) => setSolicitacaoDataProgramacao(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                  </div>

                  <div className="bg-[#030D14] border border-cyan-800/50 rounded-xl p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-cyan-300 text-xs">EED Solicitado</span>
                      <button type="button" onClick={adicionarLinhaMaterial} className="px-3 py-1.5 rounded-lg bg-cyan-950 hover:bg-cyan-900 border border-cyan-700 text-cyan-200 font-bold text-xs">+ Adicionar EED</button>
                    </div>
                    {listaItensSolicitacao.map((item, index) => (
                      <div key={index} className="flex items-center gap-2">
                        <input type="text" required value={item.material} onChange={(e) => atualizarItemMaterial(index, 'material', e.target.value)} placeholder={`EED ${index + 1}`} className="flex-1 h-9 px-3 rounded-lg bg-[#051A24] border border-cyan-800/60 text-white text-xs" />
                        <input type="number" min="1" required value={item.quantidade} onChange={(e) => atualizarItemMaterial(index, 'quantidade', Number(e.target.value))} className="w-24 h-9 px-2 text-center rounded-lg bg-[#051A24] border border-cyan-800/60 text-white text-xs" />
                        {listaItensSolicitacao.length > 1 && (
                          <button type="button" onClick={() => removerLinhaMaterial(index)} className="h-9 w-9 rounded-lg bg-rose-950/60 text-rose-300 border border-rose-800">✕</button>
                        )}
                      </div>
                    ))}
                  </div>

                  <div>
                    <label className="block font-semibold text-zinc-300 mb-1">Observação</label>
                    <textarea rows="3" value={solicitacaoObservacao} onChange={(e) => setSolicitacaoObservacao(e.target.value)} className="w-full p-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white resize-none"></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-cyan-800/40">
                    <button type="button" onClick={() => setModalSolicitacaoAberto(false)} className="px-4 py-2 rounded-xl text-zinc-400">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:opacity-90 text-white font-bold">Gravar Solicitação</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ESTOQUE */}
          {modalMaterialAberto && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm">
              <div className="bg-[#051A24] border border-cyan-700/60 rounded-2xl p-6 max-w-2xl w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-cyan-800/40 pb-3">
                  <h3 className="font-bold text-base text-white">{materialEmEdicao ? 'Editar Material' : 'Adicionar Material'}</h3>
                  <button type="button" onClick={() => setModalMaterialAberto(false)} className="text-zinc-400">✕</button>
                </div>
                <form onSubmit={salvarMaterial} className="space-y-4 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Empreiteira *</label>
                      <input type="text" required value={campoEmpreiteira} onChange={(e) => setCampoEmpreiteira(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Código Material *</label>
                      <input type="text" required value={campoCodigoMaterial} onChange={(e) => setCampoCodigoMaterial(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="block font-semibold text-zinc-300 mb-1">Descrição *</label>
                      <input type="text" required value={campoDescSimplificada} onChange={(e) => setCampoDescSimplificada(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Saldo Físico *</label>
                      <input type="number" min="0" required value={campoSaldoFisico} onChange={(e) => setCampoSaldoFisico(e.target.value === '' ? '' : Number(e.target.value))} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Cod Depósito *</label>
                      <input type="text" required value={campoCodDeposito} onChange={(e) => setCampoCodDeposito(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Supervisão</label>
                      <input type="text" value={campoSupervisao} onChange={(e) => setCampoSupervisao(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div>
                      <label className="block font-semibold text-zinc-300 mb-1">Tipo de Depósito</label>
                      <input type="text" required value={campoTipoDeposito} onChange={(e) => setCampoTipoDeposito(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="block font-semibold text-zinc-300 mb-1">Marca</label>
                      <input type="text" value={campoMarcaEquipamento} onChange={(e) => setCampoMarcaEquipamento(e.target.value)} className="w-full h-10 px-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-semibold text-zinc-300 mb-1">Observação</label>
                    <textarea rows="3" value={campoObservacao} onChange={(e) => setCampoObservacao(e.target.value)} className="w-full p-3 rounded-xl bg-[#030D14] border border-cyan-800/60 text-white resize-none"></textarea>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-cyan-800/40">
                    <button type="button" onClick={() => setModalMaterialAberto(false)} className="px-4 py-2 rounded-xl text-zinc-400">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:opacity-90 text-white font-bold">{materialEmEdicao ? 'Salvar Alterações' : 'Cadastrar'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: SENHA CHAVE DE AÇÕES (69472) */}
          {modalSenhaAberto && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="bg-[#051A24] border border-emerald-500/50 rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                <h3 className="font-bold text-white text-sm">Autorização Requerida</h3>
                <form onSubmit={validarSenhaEExecutar} className="space-y-3">
                  <input
                    type="password"
                    autoFocus
                    maxLength="10"
                    value={senhaDigitada}
                    onChange={(e) => {
                      setSenhaDigitada(e.target.value);
                      setExibirErroSenha(false);
                    }}
                    placeholder="Digite a senha..."
                    className="w-full h-11 px-3.5 text-center tracking-widest text-lg font-bold rounded-xl bg-[#030D14] border border-cyan-800/60 text-white focus:outline-none focus:border-emerald-400"
                  />
                  {exibirErroSenha && <p className="text-xs text-rose-400 text-center">Senha incorreta!</p>}
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setModalSenhaAberto(false)} className="px-4 py-2 rounded-xl text-zinc-400 text-xs">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:opacity-90 text-white font-bold text-xs">Confirmar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
